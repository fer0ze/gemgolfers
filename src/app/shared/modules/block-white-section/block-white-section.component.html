<div class="bg-gray-200 w-40 shadow rounded-lg p-4 flex items-center justify-between">
    <!-- Icon -->
    <div class="flex-shrink-0">
        <div class="w-12 h-12 rounded-full flex items-center justify-center bg-orange-400 text-gray-50">
            <mat-icon class="text-xl">{{ icon }}</mat-icon>
        </div>
    </div>
    <div class="flex flex-col gap-2">
        <!-- Label -->
        <div class="text-center flex-1">
            <p class="text-gray-500 text-lg font-medium">{{ label }}</p>
        </div>

        <!-- Data -->
        <div class="text-center">
            <p class="text-lg font-semibold text-gray-800">
                {{ data | number : '1.2-2' }} %
            </p>
        </div>
    </div>
</div>
