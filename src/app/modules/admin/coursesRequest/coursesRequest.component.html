<div class="flex-auto">
    <div class="flex sm:flex-row md:flex-auto flex-auto bg-card justify-between py-8 px-6 md:px-8 border-b">
        <div class="flex-auto">
            <div class="text-4xl font-extrabold tracking-tight leading-none">
                Courses Request
            </div>

            <div class="flex flex-auto items-center mt-4 sm:mt-0 md:mt-4">
                <div class="flex-auto">
                    <mat-form-field appearance="fill"
                        class="fuse-mat-no-subscript flex-auto fuse-mat-rounded w-full min-w-50">
                        <input matInput (keyup)="applyFilter($event.target.value)" placeholder="Search By Name" />
                        <mat-icon matPrefix>search</mat-icon>
                    </mat-form-field>
                </div>
            </div>
        </div>
    </div>

    <div class="relative bg-card">
        <table mat-table [dataSource]="dataSource" class="w-full bg-transparent" matSort>
            <!-- Serial Column -->
            <ng-container matColumnDef="id">
                <th class="bg-gray-50 dark:bg-black dark:bg-opacity-5" mat-header-cell *matHeaderCellDef>
                    Sr.
                </th>
                <td class="pr-6 font-medium text-sm text-secondary whitespace-nowrap" mat-cell
                    *matCellDef="let row; let i = index">
                    {{ i + 1 }}
                </td>
            </ng-container>

            <!-- Name Column -->
            <ng-container matColumnDef="name">
                <th class="bg-gray-50 dark:bg-black dark:bg-opacity-5" mat-header-cell *matHeaderCellDef
                    mat-sort-header>
                    Course Name
                </th>
                <td mat-cell *matCellDef="let row">
                    <span class="pr-6 font-medium whitespace-nowrap ">{{
                        row.name }}</span>
                </td>
            </ng-container>

            <!-- Phone Column -->
            <ng-container matColumnDef="country">
                <th class="bg-gray-50 dark:bg-black dark:bg-opacity-5" mat-header-cell *matHeaderCellDef
                    mat-sort-header>
                    Country
                </th>
                <td class="pr-6 font-medium whitespace-nowrap" mat-cell *matCellDef="let row">
                    {{ row.country }}
                </td>
            </ng-container>
            <ng-container matColumnDef="state">
                <th class="bg-gray-50 dark:bg-black dark:bg-opacity-5" mat-header-cell *matHeaderCellDef
                    mat-sort-header>
                    State
                </th>
                <td class="pr-6 font-medium whitespace-nowrap" mat-cell *matCellDef="let row">
                    {{ row.state }}
                </td>
            </ng-container>

            <!-- Email Column -->
            <ng-container matColumnDef="city">
                <th class="bg-gray-50 dark:bg-black dark:bg-opacity-5" mat-header-cell *matHeaderCellDef
                    mat-sort-header>
                    City
                </th>
                <td class="pr-6 font-medium whitespace-nowrap" mat-cell *matCellDef="let row">
                    {{ row.city }}
                </td>
            </ng-container>
            <ng-container matColumnDef="admin">
                <th class="bg-gray-50 dark:bg-black dark:bg-opacity-5" mat-header-cell *matHeaderCellDef
                    mat-sort-header>
                    Added By
                </th>
                <td class="pr-6 font-medium whitespace-nowrap" mat-cell *matCellDef="let row">
                    <div class="truncate font-medium">
                        {{ row?.admin?.fullName??'' }}
                    </div>
                    <div class="flex flex-col">
                        <div class="text-secondary truncate ">
                            {{ row?.admin?.email??'' }}
                        </div>
                        <div class="text-secondary truncate">
                            {{ row?.admin?.phone??'' }}
                        </div>

                    </div>

                </td>
            </ng-container>
            <ng-container matColumnDef="createdAt">
                <th class="bg-gray-50 dark:bg-black dark:bg-opacity-5" mat-header-cell *matHeaderCellDef
                    mat-sort-header>
                    Date
                </th>
                <td class="pr-6 font-medium whitespace-nowrap" mat-cell *matCellDef="let row">
                    {{ row.createdAt | date:'MMM dd, h:mm a' }}
                </td>
            </ng-container>



            <!-- <ng-container matColumnDef="delete">
      <th mat-header-cell *matHeaderCellDef>Del</th>
      <td mat-cell *matCellDef="let element">
        <button mat-icon-button color="warn">
          <mat-icon class="mat-18">delete</mat-icon>
        </button>
      </td>
    </ng-container> -->

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr class="order-row h-16 hover:bg-gray-100" mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>

        <mat-paginator [pageSize]="20" [pageSizeOptions]="[10, 20, 50, 100]"></mat-paginator>
    </div>
</div>
