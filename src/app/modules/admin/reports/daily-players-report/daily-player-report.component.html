<div class="flex-auto">
    <div
        class="flex flex-col sm:flex-row md:flex-col flex-auto bg-card justify-between py-12 px-6 md:px-8 border-b"
    >
        <div class="flex flex-row">
            <div class="text-6xl font-extrabold tracking-tight leading-none">
                Player Round Statistics
            </div>
            <div class="flex items-center">
                <div class="mx-7 w-100">
                    <form [formGroup]="scheduleForm" autocomplete="off" novalidate>
                        <mat-form-field class="fuse-mat-no-subscript w-full">
                            <input
                                matInput
                                [matDatepicker]="picker2"
                                [min]="minDate"
                                [max]="maxDate"
                                formControlName="Date"
                                placeholder="Pick Date"
                                
                            />
                            <mat-datepicker-toggle
                                matSuffix
                                [for]="picker2"
                            ></mat-datepicker-toggle>
                            <mat-datepicker
                                #picker2
                                disabled="false"
                            ></mat-datepicker>
                            <mat-error>This field is required</mat-error>
                        </mat-form-field>
                    </form>
                </div>
    
                <div>
                    <button
                        mat-raised-button
                        color="primary"
                        (click)="onDatePick()"
                    >
                        Search
                    </button>
                    <!-- <button mat-raised-button color="primary" (click)="showDuplicates()" >Duplicates</button> -->
                </div>
            </div>
        </div>
        
    </div>

    <div
        
        class="sm:col-span-6 flex flex-col flex-auto p-6 m-8 bg-card shadow rounded-2xl overflow-hidden"
    >
        <div class="text-lg font-medium tracking-tight leading-6 truncate">
            <div class="flex  justify-end ml-auto mb-1">
                <div class="flex-auto max-w-xs">
                    <mat-form-field class="fuse-mat-dense fuse-mat-no-subscript fuse-mat-rounded w-full min-w-50">
                        <mat-icon class="icon-size-5" matPrefix [svgIcon]="'heroicons_solid:search'"></mat-icon>
                        <input matInput (keyup)="applyFilter($event.target.value)"
                            [autocomplete]="'off'" [placeholder]="'Search'" />
                    </mat-form-field>
                </div>
            </div>
        </div>
        <div class="flex flex-col flex-auto mt-2 overflow-x-auto">
            <table id="a" mat-table [dataSource]="dataSource" matSort>
               
                <ng-container matColumnDef="id">
                    <th mat-header-cell *matHeaderCellDef>Sr.</th>
                    <td mat-cell *matCellDef="let row; let i = index">
                        {{ i + 1 }}
                    </td>
                </ng-container>
                <ng-container matColumnDef="memebrshipNo">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header>
                        MembershipNo
                    </th>
                    <td mat-cell *matCellDef="let row">
                        {{ row.memebrshipNo }}
                    </td>
                </ng-container>
                <ng-container matColumnDef="name">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header>
                        Name
                    </th>
                    <td mat-cell *matCellDef="let row">
                        {{ row.name }}
                    </td>
                </ng-container>

                <ng-container matColumnDef="category">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header>
                        Category
                    </th>
                    <td mat-cell *matCellDef="let row">{{ row.category }}</td>
                </ng-container>
                <ng-container matColumnDef="holeSet">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header>
                        HoleSet
                    </th>
                    <td mat-cell *matCellDef="let row">
                        {{ row.holeSets }}
                    </td>
                </ng-container>
                <ng-container matColumnDef="tee">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header>
                        Tee
                    </th>
                    <td mat-cell *matCellDef="let row">
                        {{ row.tee }}
                    </td>
                </ng-container>
                <ng-container matColumnDef="time">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header>
                        Time
                    </th>
                    <td mat-cell *matCellDef="let row">
                        {{ row.time }}
                    </td>
                </ng-container>
               
           

                <tr
                    mat-header-row
                    *matHeaderRowDef="displayedColumnsCongu"
                ></tr>
                <tr
                    mat-row
                    *matRowDef="let row; columns: displayedColumnsCongu"
                ></tr>
            </table>
            <mat-paginator
                [pageSize]="20"
                [pageSizeOptions]="[10, 20, 50, 100]"
            ></mat-paginator>
        </div>
    </div>
</div>
