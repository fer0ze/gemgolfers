<div class="flex flex-col flex-auto w-full">
    <div class="text-5xl font-extrabold bg-card py-8 px-6 md:px-8">
        Club Report
    </div>

    <div class="gap-8 w-full py-8 px-6 md:px-8 ">
        <div *ngIf="showdata | async" class="flex flex-col flex-auto bg-card shadow rounded-2xl overflow-hidden">
            <div class="flex flex-col flex-auto p-4">
                <apx-chart class="flex-auto w-full h-80" [chart]="chartGithubIssues.chart"
                    [colors]="chartGithubIssues.colors" [dataLabels]="chartGithubIssues.dataLabels"
                    [grid]="chartGithubIssues.grid" [labels]="chartGithubIssues.labels"
                    [legend]="chartGithubIssues.legend" [plotOptions]="chartGithubIssues.plotOptions"
                    [series]="chartGithubIssues.series[0]" [states]="chartGithubIssues.states"
                    [stroke]="chartGithubIssues.stroke" [tooltip]="chartGithubIssues.tooltip"
                    [xaxis]="chartGithubIssues.xaxis" [yaxis]="chartGithubIssues.yaxis"></apx-chart>
            </div>
        </div>
        <div class="flex flex-col mt-8 flex-auto bg-card shadow rounded-2xl overflow-hidden">
            <div class="p-6 flex flex-row">
                <div class="flex flex-col">
                    <div class="mr-4 text-lg font-medium tracking-tight leading-6 truncate">
                        Club Details
                    </div>
                    <div class="text-secondary font-medium">
                        {{ clubs.length }} total
                    </div>
                </div>
                <div class="w-60">
                    <mat-form-field class="fuse-mat-dense fuse-mat-no-subscript fuse-mat-rounded w-full">
                        <mat-icon class="icon-size-5" matPrefix [svgIcon]="'heroicons_solid:search'"></mat-icon>
                        <input matInput (keyup)="applyFilter($event.target.value)" [autocomplete]="'off'"
                            [placeholder]="'Search club'" />
                    </mat-form-field>
                </div>
            </div>
            <div class="overflow-x-auto mx-6">
                <table mat-table [dataSource]="dataSource" matSort>
                    <ng-container matColumnDef="id">
                        <th mat-header-cell *matHeaderCellDef>Sr.</th>
                        <td mat-cell *matCellDef="let row; let i = index">
                            {{ i + 1 }}
                        </td>
                    </ng-container>
                    <ng-container matColumnDef="name">
                        <th mat-header-cell *matHeaderCellDef>Name</th>
                        <td mat-cell *matCellDef="let row; let i = index">
                            {{ row.name }}
                        </td>
                    </ng-container>
                    <ng-container matColumnDef="email">
                        <th mat-header-cell *matHeaderCellDef>Email</th>
                        <td mat-cell *matCellDef="let row; let i = index">
                            {{ row.email }}
                        </td>
                    </ng-container>
                    <ng-container matColumnDef="phone">
                        <th mat-header-cell *matHeaderCellDef>Phone</th>
                        <td mat-cell *matCellDef="let row; let i = index">
                            {{ row.phone }}
                        </td>
                    </ng-container>
                    <ng-container matColumnDef="members">
                        <th mat-header-cell *matHeaderCellDef>Members</th>
                        <td mat-cell *matCellDef="let row; let i = index">
                            {{ row.members.length }}
                        </td>
                    </ng-container>
                    <ng-container matColumnDef="course">
                        <th mat-header-cell *matHeaderCellDef>Course</th>
                        <td mat-cell *matCellDef="let row; let i = index">
                            {{
                            row.courses.length > 0
                            ? row.courses[0].name
                            : "-"
                            }}
                        </td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
                </table>
                <mat-paginator [pageSize]="10" [pageSizeOptions]="[10, 20, 50, 100]"></mat-paginator>
            </div>
        </div>
    </div>

</div>
