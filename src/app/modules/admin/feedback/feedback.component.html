<div class="flex-auto">
    <div
        class="flex flex-auto sm:flex-row md:flex-auto flex-auto bg-card justify-between py-8 px-6 md:px-8 border-b"
    >
        <div class="flex-auto">
            <div class="text-4xl font-extrabold tracking-tight leading-none">
                Feedbacks
            </div>

            <div class="flex flex-auto items-center mt-4 sm:mt-0 md:mt-4">
                <div class="flex-auto">
                    <mat-form-field
                        appearance="fill"
                        class="fuse-mat-no-subscript flex-auto fuse-mat-rounded w-full min-w-50"
                    >
                        <input
                            matInput
                            (keyup)="applyFilter($event.target.value)"
                            placeholder="Search By Name"
                        />
                        <mat-icon matPrefix>search</mat-icon>
                    </mat-form-field>
                </div>
            </div>
        </div>
    </div>

    <div class="relative bg-card">
        <table
            mat-table
            [dataSource]="dataSource"
            class="w-full bg-transparent"
            matSort
        >
            <!-- Serial Column -->
            <ng-container matColumnDef="id">
                <th
                    class="bg-gray-50 dark:bg-black dark:bg-opacity-5"
                    mat-header-cell
                    *matHeaderCellDef
                >
                    Sr.
                </th>
                <td
                    class="pr-6 font-medium text-sm text-secondary whitespace-nowrap"
                    mat-cell
                    *matCellDef="let row; let i = index"
                >
                    {{ i + 1 }}
                </td>
            </ng-container>

            <!-- Name Column -->
            <ng-container matColumnDef="name">
                <th
                    class="bg-gray-50 dark:bg-black dark:bg-opacity-5"
                    mat-header-cell
                    *matHeaderCellDef
                    mat-sort-header
                >
                    Name
                </th>
                <td mat-cell *matCellDef="let row">
                    <span
                        class="pr-6 font-medium whitespace-nowrap underline underline-offset-1 cursor-pointer"
                        >{{ row.name }}</span
                    >
                </td>
            </ng-container>

            <!-- Phone Column -->
            <ng-container matColumnDef="type">
                <th
                    class="bg-gray-50 dark:bg-black dark:bg-opacity-5"
                    mat-header-cell
                    *matHeaderCellDef
                    mat-sort-header
                >
                    type
                </th>
                <td
                    class="pr-6 font-medium whitespace-nowrap"
                    mat-cell
                    *matCellDef="let row"
                >
                    {{ row.type }}
                </td>
            </ng-container>

            <!-- Email Column -->
            <ng-container matColumnDef="contact">
                <th
                    class="bg-gray-50 dark:bg-black dark:bg-opacity-5"
                    mat-header-cell
                    *matHeaderCellDef
                    mat-sort-header
                >
                    contact
                </th>
                <td
                    class="pr-6 font-medium whitespace-nowrap"
                    mat-cell
                    *matCellDef="let row"
                >
                    {{ row.contact }}
                </td>
            </ng-container>

            <ng-container matColumnDef="details">
                <th
                    class="bg-gray-50 dark:bg-black dark:bg-opacity-5"
                    mat-header-cell
                    *matHeaderCellDef
                >
                    Details
                </th>
                <td
                    class="pr-6 font-medium whitespace-nowrap"
                    mat-cell
                    *matCellDef="let row"
                >
                    <button
                        mat-icon-button
                        color="primary"
                        (click)="showMessage(row.message)"
                    >
                        <mat-icon class="mat-18">reorder</mat-icon>
                    </button>
                </td>
            </ng-container>

            <!-- <ng-container matColumnDef="delete">
      <th mat-header-cell *matHeaderCellDef>Del</th>
      <td mat-cell *matCellDef="let element">
        <button mat-icon-button color="warn">
          <mat-icon class="mat-18">delete</mat-icon>
        </button>
      </td>
    </ng-container> -->

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr
                class="order-row h-16 hover:bg-gray-100 cursor-pointer"
                mat-row
                *matRowDef="let row; columns: displayedColumns"
                (click)="showMessage(row.message)"
            ></tr>
        </table>

        <mat-paginator
            [pageSize]="20"
            [pageSizeOptions]="[10, 20, 50, 100]"
        ></mat-paginator>
    </div>
</div>
