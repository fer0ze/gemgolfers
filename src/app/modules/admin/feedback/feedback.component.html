    <div class="bg-card">
        <div class="flex flex-col w-full max-w-screen-xl mx-auto px-6 sm:px-0">
            <div class="flex flex-col sm:flex-row flex-auto sm:items-center min-w-0 my-6 mx-2 sm:my-12 md:my-12">
                <!-- Avatar and name -->
                <div class="flex flex-auto items-center min-w-0">
                    <div class="flex flex-col min-w-0 ">
                        <ng-container>
                            <div class="text-4xl font-extrabold tracking-tight">Feedbacks</div>
                            <div class="font-medium text-secondary -mt-2">
                                List of added feedbacks
                            </div>
                        </ng-container>
                    </div>
                </div>
                <div class="flex items-center mt-6 sm:mt-0 sm:ml-2 space-x-3 flex-wrap gap-2">
                    <button mat-stroked-button (click)="markAllAs('pending')"
                        style="border-color:#f97316;color:#f97316">
                        Mark All Pending
                    </button>
                    <button mat-stroked-button (click)="markAllAs('reviewing')"
                        style="border-color:#3b82f6;color:#3b82f6">
                        Mark All Reviewing
                    </button>
                    <button mat-stroked-button (click)="markAllAs('resolved')"
                        style="border-color:#22c55e;color:#22c55e">
                        Mark All Resolved
                    </button>
                    <button class="bg-accent" mat-flat-button (click)="addNewFeedback()" [color]="'accent'">
                        <mat-icon class="icon-size-5" [svgIcon]="'heroicons_solid:plus-circle'"></mat-icon>
                        <span class="ml-2">Add new</span>
                    </button>
                </div>

            </div>

        </div>
    </div>

    <div class="flex-auto border-t  -mt-px p-2 sm:p-2">
        <div class="w-full max-w-screen-xl mx-auto">
            <div class="grid grid-cols-1 xl:grid-cols-2 gap-8 w-full mt-8">
                <!-- Recent assessments table -->
                <div class="xl:col-span-2 flex flex-col flex-auto bg-card shadow rounded-2xl overflow-hidden">
                    <div class="p-6 flex flex-col sm:flex-row items-center justify-between">
                        <div>
                            <div class="mr-4 text-lg font-medium tracking-tight leading-6 truncate">Feedbacks
                            </div>
                            <div class="text-secondary font-medium">Total {{this.feedback.length}}
                            </div>
                        </div>
                        <div class="flex flex-row justify-between items-center">

                            <div class="flex flex-col sm:flex-row items-center py-0 lg:py-2">
                                <!-- <mat-form-field
                                            class="mr-2 fuse-mat-dense fuse-mat-no-subscript fuse-mat-rounded min-w-64">
                                            <mat-select [value]="0" (selectionChange)="filterByCategory($event)">
                                                <ng-container *ngFor="let category of categories">
                                                    <mat-option [value]="category.value">{{
                                                        category.title
                                                        }}</mat-option>
                                                </ng-container>
                                            </mat-select>
                                        </mat-form-field> -->
                                <mat-form-field class="fuse-mat-dense fuse-mat-no-subscript fuse-mat-rounded min-w-64">
                                    <mat-icon class="icon-size-5" matPrefix
                                        [svgIcon]="'heroicons_solid:search'"></mat-icon>
                                    <input matInput (input)="applyFilter($event.target.value)"
                                        [placeholder]="'Search'" />
                                </mat-form-field>
                            </div>

                        </div>
                    </div>
                    <div class="overflow-x-auto mx-6">
                        <table mat-table [dataSource]="dataSource" class="w-full bg-transparent" matSort>
                            <!-- Serial Column -->
                            <ng-container matColumnDef="id">
                                <th class="bg-gray-50 dark:bg-black dark:bg-opacity-5" mat-header-cell
                                    *matHeaderCellDef>
                                    Sr.
                                </th>
                                <td class="pr-6 font-medium text-sm text-secondary whitespace-nowrap" mat-cell
                                    *matCellDef="let row; let i = index">
                                    {{ i + 1 }}
                                </td>
                            </ng-container>

                            <!-- Name Column -->
                            <ng-container matColumnDef="name">
                                <th class="bg-gray-50 dark:bg-black dark:bg-opacity-5" mat-header-cell *matHeaderCellDef
                                    mat-sort-header>
                                    Contact Name
                                </th>
                                <td mat-cell *matCellDef="let row">
                                    <span
                                        class="pr-6 font-medium whitespace-nowrap cursor-pointer">{{
                                        row.name }}</span>
                                </td>
                            </ng-container>

                            <!-- Phone Column -->
                            <ng-container matColumnDef="type">
                                <th class="bg-gray-50 dark:bg-black dark:bg-opacity-5" mat-header-cell *matHeaderCellDef
                                    mat-sort-header>
                                    Type
                                </th>
                                <td class="pr-6 font-medium whitespace-nowrap cursor-pointer" mat-cell *matCellDef="let row">
                                    {{ row.type }}
                                </td>
                            </ng-container>

                            <!-- Email Column -->
                            <ng-container matColumnDef="contact">
                                <th class="bg-gray-50 dark:bg-black dark:bg-opacity-5" mat-header-cell *matHeaderCellDef
                                    mat-sort-header>
                                    Email/Phone
                                </th>
                                <td class="pr-6 font-medium whitespace-nowrap cursor-pointer" mat-cell *matCellDef="let row">
                                    {{ row.contact }}
                                </td>
                            </ng-container>
                            <ng-container matColumnDef="createdAt">
                                <th class="bg-gray-50 dark:bg-black dark:bg-opacity-5" mat-header-cell *matHeaderCellDef
                                    mat-sort-header>
                                    Submitted Date
                                </th>
                                <td class="pr-6 font-medium whitespace-nowrap cursor-pointer" mat-cell *matCellDef="let row">
                                    {{ row.dateTime| date:'MMM dd, h:mm a' }}
                                </td>
                            </ng-container>

                            <!-- Status Column -->
                            <ng-container matColumnDef="status">
                                <th class="bg-gray-50 dark:bg-black dark:bg-opacity-5" mat-header-cell *matHeaderCellDef>
                                    Status
                                </th>
                                <td class="pr-6 whitespace-nowrap" mat-cell *matCellDef="let row">
                                    <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold text-white"
                                        [style.background-color]="getStatusColor(row.status)">
                                        {{ getStatusLabel(row.status) }}
                                    </span>
                                </td>
                            </ng-container>

                            <ng-container matColumnDef="details">
                                <th class="bg-gray-50 dark:bg-black dark:bg-opacity-5" mat-header-cell
                                    *matHeaderCellDef>
                                    Details
                                </th>
                                <td class="pr-6 font-medium whitespace-nowrap cursor-pointer" mat-cell *matCellDef="let row">
                                    <button mat-icon-button color="primary" (click)="openDetail(row); $event.stopPropagation()">
                                        <mat-icon class="mat-18">reorder</mat-icon>
                                    </button>
                                </td>
                            </ng-container>

                            <!-- <ng-container matColumnDef="delete">
      <th mat-header-cell *matHeaderCellDef>Del</th>
      <td mat-cell *matCellDef="let element">
        <button mat-icon-button color="warn">
          <mat-icon class="mat-18">delete</mat-icon>
        </button>
      </td>
    </ng-container> -->

                            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                            <tr class="order-row h-16 hover:bg-gray-100 cursor-pointer" mat-row
                                *matRowDef="let row; columns: displayedColumns" (click)="openDetail(row)"></tr>
                        </table>

                        <mat-paginator [pageSize]="20" [pageSizeOptions]="[10, 20, 50, 100]"></mat-paginator>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
