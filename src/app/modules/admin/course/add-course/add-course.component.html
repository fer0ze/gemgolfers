<div
    class="flex flex-col w-full min-w-0 sm:absolute sm:inset-0 sm:overflow-hidden"
>
    <!-- Edit mode -->
    <mat-drawer-container class="flex-auto sm:h-full">
        <!-- Contact form -->
        <mat-drawer
            class="sm:w-96 dark:bg-gray-900"
            [autoFocus]="false"
            [mode]="drawerMode"
            [opened]="true"
            #drawer
        >
            <!-- Header -->
            <div class="flex items-center justify-between m-8 mr-6 sm:my-10">
                <!-- Title -->
                <div
                    class="text-4xl font-extrabold tracking-tight leading-none"
                >
                    ADD COURSE FORM
                </div>
                <!-- Close button -->
                <div class="lg:hidden">
                    <button mat-icon-button (click)="drawer.close()">
                        <mat-icon [svgIcon]="'heroicons_outline:x'"></mat-icon>
                    </button>
                </div>
            </div>
            <div class="flex flex-col divide-y border-t border-b">
                <ng-container>
                    <div
                        class="flex px-8 py-5 cursor-pointer hover:bg-gray-100 'bg-primary-50"
                    >
                        <mat-icon
                            class="text-primary dark:text-primary-500"
                            [svgIcon]="'heroicons_outline:user-circle'"
                        ></mat-icon>
                        <div class="ml-3">
                            <div
                                class="font-medium leading-6 text-primary dark:text-primary-500"
                            >
                                Add Course
                            </div>
                            <div class="mt-0.5 text-secondary">
                                Create you courses by adding them
                            </div>
                        </div>
                    </div>
                </ng-container>
            </div>
        </mat-drawer>
        <div class="flex-auto px-6 pt-9 pb-12 md:p-8 md:pb-12 lg:p-12">
            <div class="flex items-center">
                <!-- Drawer toggle -->
                <button class="lg:hidden -ml-2" mat-icon-button>
                    <mat-icon [svgIcon]="'heroicons_outline:menu'"></mat-icon>
                </button>

                <!-- Panel title -->
                <div
                    class="ml-2 lg:ml-0 text-3xl font-bold tracking-tight leading-none"
                >
                    Setup
                </div>
            </div>
            <div class="w-full max-w-3xl">
                <div class="text-xl mt-8">New Course</div>
                <div class="text-secondary">
                    Following information is mandatory, be careful!
                </div>
                <form [formGroup]="courseForm" autocomplete="off" novalidate>
                    <div class="grid sm:grid-cols-4 gap-6 w-full mt-8">
                        <div class="sm:col-span-2">
                            <mat-form-field
                                class="fuse-mat-no-subscript w-full"
                            >
                                <input
                                    matInput
                                    type="text"
                                    placeholder="Course Name"
                                    formControlName="courseName"
                                />
                                <mat-icon
                                    class="primary-foreground"
                                    matSuffix
                                ></mat-icon>
                                <mat-error>Course Name is required</mat-error>
                            </mat-form-field>
                        </div>
                        <div class="sm:col-span-2">
                            <mat-form-field
                                class="fuse-mat-no-subscript w-full"
                            >
                                <mat-select
                                    (selectionChange)="
                                        countrySelected($event.value)
                                    "
                                    placeholder="County Name"
                                    formControlName="country"
                                >
                                    <mat-option
                                        *ngFor="let country of listCountries"
                                        [value]="country.id"
                                        >{{ country.id }}</mat-option
                                    >
                                </mat-select>

                                <mat-error *ngIf="country.invalid"
                                    >Country Name is required</mat-error
                                >
                            </mat-form-field>
                        </div>
                        <div class="sm:col-span-2">
                            <mat-form-field
                                class="fuse-mat-no-subscript w-full"
                            >
                                <mat-select
                                    placeholder="City Name"
                                    formControlName="city"
                                >
                                    <mat-option
                                        *ngFor="let city of listCity"
                                        [value]="city"
                                        >{{ city }}</mat-option
                                    >
                                </mat-select>

                                <mat-error *ngIf="city.invalid"
                                    >City Name is required</mat-error
                                >
                            </mat-form-field>
                        </div>
                        <div class="sm:col-span-2">
                            <mat-form-field
                                class="fuse-mat-no-subscript w-full"
                            >
                                <mat-select
                                    (selectionChange)="selectedHole($event)"
                                    placeholder="NoOfHoles"
                                    formControlName="noOfHoles"
                                >
                                    <mat-option value="9">9</mat-option>
                                    <mat-option value="18">18</mat-option>
                                    <mat-option value="27">27</mat-option>
                                    <mat-option value="36">36</mat-option>
                                </mat-select>

                                <mat-error>Hole No is required</mat-error>
                            </mat-form-field>
                        </div>
                    </div>
                    <div class="my-4 border-t"></div>
                    <div class="flex items-center justify-end">
                        <button
                            type="button"
                            mat-raised-button
                            color="accent"
                            (click)="onCancel()"
                        >
                            Cancel
                        </button>
                        <button
                            class="ml-2"
                            type="button"
                            mat-raised-button
                            color="primary"
                            [disabled]="!courseForm.valid"
                            (click)="createPlayer(courseForm.value)"
                        >
                            Save
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </mat-drawer-container>
</div>
