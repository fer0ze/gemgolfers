<div class="absolute inset-0 flex flex-col min-w-0 overflow-y-auto">
    <div class="relative flex-0 py-8 px-4 overflow-hidden">
        <div
            class="grid grid-cols-1 sm:grid-cols-1  gap-6 w-full min-w-0 logo"
        >
            <div class="flex flex-row justify-center sm:inline md:hidden">
                <div
                    class="py-0.5 ml-1 w-44 leading-8 flex text-center justify-center rounded-lg shadow-2xl bg-card text-md font-extrabold '"
                    style="color: #004987"
                >
                    Powered by Gemgolfers
                </div>
            </div>
            <div
                class="z-10 col-span-1 relative flex flex-col text-center items-center"
            >
                <!-- <h2
                    class="text-3xl md:pt-4 sm:pt-0 text-neutral-50 mb-4 font-semibold"
                >
                    {{ Leaderboard
                </h2> -->
                <div
                    class="mt-1 text-3xl text-neutral-50 font-extrabold tracking-tight leading-tight text-center"
                >
                    PointTable
                </div>
            </div>
        </div>
    </div>
    <div *ngIf="!isLoading" class="flex flex-auto p-6 sm:p-10">
        <div
            class="flex flex-col flex-auto w-full max-w-7xl sm:max-w-5xl mx-auto"
        >
            <div
                class="flex flex-col sm:flex-row items-center justify-center mb-1"
            >
                <ul class="responsive-table" >
                    <li class="table-row" *ngFor="let item of Leaders">
                        <div class="col col-1">
                            {{ item.position }}
                        </div>
                        <div class="col col-2">
                            {{ item.name }}
                            <div
                                *ngIf="item.handicap > 0"
                                class="text-xs flex items-center"
                            >
                                HC:{{ item.handicap }}
                            </div>
                        </div>
                        <div class="col col-5">
                            {{ item.totalScore }}
                        </div>
                    </li>
                </ul>
            </div>
        </div>
    </div>
    <div class="outer-spinner" *ngIf="isLoading">
        <!-- <img
            src="assets/images/logo/logo.svg"
            alt="Fuse logo"> -->
        <div class="spinner">
            <div class="bounce1"></div>
            <div class="bounce2"></div>
            <div class="bounce3"></div>
        </div>
    </div>
</div>
