<div class="flex flex-col flex-auto w-full">
    <div class="flex flex-wrap w-full max-w-screen-xl mx-auto p-6 md:p-8">
        <!-- Title and action buttons -->
        <div class="flex items-center justify-between w-full">
            <div>
                <h2 class="text-3xl font-semibold tracking-tight leading-8">
                    Leagues
                </h2>
                <div class="font-medium tracking-tight text-secondary">
                    Keep track of Leagues
                </div>
            </div>
            <div class="flex items-center ml-6">
                <button
                    class="hidden sm:inline-flex ml-3"
                    mat-flat-button
                    [color]="'primary'"
                >
                    <mat-icon
                        class="icon-size-5"
                        [svgIcon]="'heroicons_solid:save'"
                    ></mat-icon>
                    <span class="ml-2">Add New League</span>
                </button>

                <!-- Actions menu (visible on xs) -->
                <div class="sm:hidden">
                    <button [matMenuTriggerFor]="actionsMenu" mat-icon-button>
                        <mat-icon
                            [svgIcon]="'heroicons_outline:dots-vertical'"
                        ></mat-icon>
                    </button>
                    <mat-menu #actionsMenu="matMenu">
                        <button mat-menu-item>Export</button>
                        <button mat-menu-item>Reports</button>
                        <button mat-menu-item>Settings</button>
                    </mat-menu>
                </div>
            </div>
        </div>

        <div class="gap-8 w-full mt-8">
            <div
                *ngIf="showdata | async"
                class="flex flex-col flex-auto bg-card shadow rounded-2xl overflow-hidden"
            >
                <div class="flex flex-col flex-auto p-4">
                    <apx-chart
                        class="flex-auto w-full h-80"
                        [chart]="chartGithubIssues.chart"
                        [colors]="chartGithubIssues.colors"
                        [dataLabels]="chartGithubIssues.dataLabels"
                        [grid]="chartGithubIssues.grid"
                        [labels]="chartGithubIssues.labels"
                        [legend]="chartGithubIssues.legend"
                        [plotOptions]="chartGithubIssues.plotOptions"
                        [series]="chartGithubIssues.series[0]"
                        [states]="chartGithubIssues.states"
                        [stroke]="chartGithubIssues.stroke"
                        [tooltip]="chartGithubIssues.tooltip"
                        [xaxis]="chartGithubIssues.xaxis"
                        [yaxis]="chartGithubIssues.yaxis"
                    ></apx-chart>
                </div>
            </div>
            <div
                class="flex flex-col mt-8 flex-auto bg-card shadow rounded-2xl overflow-hidden"
            >
                <div class="p-6 flex flex-row">
                    <div class="flex flex-col">
                        <div
                            class="mr-4 text-lg font-medium tracking-tight leading-6 truncate"
                        >
                            League Details
                        </div>
                        <div class="text-secondary font-medium">
                            {{ clubs.length }} total
                        </div>
                    </div>
                    <div class="w-60">
                        <mat-form-field
                            class="fuse-mat-dense fuse-mat-no-subscript fuse-mat-rounded w-full"
                        >
                            <mat-icon
                                class="icon-size-5"
                                matPrefix
                                [svgIcon]="'heroicons_solid:search'"
                            ></mat-icon>
                            <input
                                matInput
                                (keyup)="applyFilter($event.target.value)"
                                [autocomplete]="'off'"
                                [placeholder]="'Search league'"
                            />
                        </mat-form-field>
                    </div>
                </div>
                <div class="overflow-x-auto mx-6">
                    <table mat-table [dataSource]="dataSource" matSort>
                        <ng-container matColumnDef="id">
                            <th mat-header-cell *matHeaderCellDef>Sr.</th>
                            <td mat-cell *matCellDef="let row; let i = index">
                                {{ i + 1 }}
                            </td>
                        </ng-container>
                        <ng-container matColumnDef="name">
                            <th mat-header-cell *matHeaderCellDef>Name</th>
                            <td mat-cell *matCellDef="let row; let i = index">
                                {{ row.name }}
                            </td>
                        </ng-container>
                        <ng-container matColumnDef="date">
                            <th mat-header-cell *matHeaderCellDef>Date</th>
                            <td mat-cell *matCellDef="let row; let i = index">
                                {{ row.dateCreated }}
                            </td>
                        </ng-container>
                        <ng-container matColumnDef="members">
                            <th mat-header-cell *matHeaderCellDef>Members</th>
                            <td mat-cell *matCellDef="let row; let i = index">
                                {{ row.members.length }}
                            </td>
                        </ng-container>
                        <ng-container matColumnDef="tournament">
                            <th mat-header-cell *matHeaderCellDef>
                                Tournaments
                            </th>
                            <td mat-cell *matCellDef="let row; let i = index">
                                {{ row.tournaments.length }}
                            </td>
                        </ng-container>
                        <ng-container matColumnDef="details">
                            <th mat-header-cell *matHeaderCellDef>
                                Points Table
                            </th>
                            <td mat-cell *matCellDef="let row; let i = index">
                                <a
                                    class="flex items-center"
                                    [routerLinkActive]="'active'"
                                    [routerLink]="['/leagueTable/' + row.id]"
                                >
                                    <button mat-icon-button color="primary">
                                        <mat-icon class="mat-18" color="accent"
                                            >reorder</mat-icon
                                        >
                                    </button>
                                </a>
                            </td>
                        </ng-container>
                        <tr
                            mat-header-row
                            *matHeaderRowDef="displayedColumns"
                        ></tr>
                        <tr
                            mat-row
                            *matRowDef="let row; columns: displayedColumns"
                        ></tr>
                    </table>
                    <mat-paginator
                        [pageSize]="10"
                        [pageSizeOptions]="[10, 20, 50, 100]"
                    ></mat-paginator>
                </div>
            </div>
        </div>
    </div>
</div>
