<div class="animate-fade-in">
    <div class="mb-6 space-y-4">
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">

            <div *ngFor="let round of tRounds" (click)="changeRound(round)"
                class="p-4 rounded-lg flex justify-between items-center cursor-pointer transition-all border-2"
                [class]="activeRound === round.round ? 'bg-emerald-50 border-emerald-500 shadow-md' : 'bg-white border-gray-200 hover:border-gray-300 hover:shadow-sm'">
                <div>
                    <p class="font-semibold text-gray-800">{{ round.label }}</p>
                    <p class="text-sm text-gray-500">{{ round.status }}</p>
                </div>
                <div class="flex items-center space-x-2">
                    <span *ngIf="round.status === 'Completed'" class="w-3 h-3 rounded-full bg-green-500"></span>
                    <span *ngIf="round.status === 'In Progress'"
                        class="w-3 h-3 rounded-full bg-yellow-500 animate-pulse"></span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5"
                        [class]="activeRound === round.round ? 'text-emerald-600' : 'text-gray-400'" fill="none"
                        viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                    </svg>
                </div>
            </div>

        </div>



        <h2 class="text-xl font-bold text-gray-900 mb-4">All Groups</h2>
        <div class="flex items-center justify-end gap-3">
            <button *ngIf="selectedMembers.length == 0" (click)="createAutoFlights()"
                class="bg-white text-gray-700 px-4 py-2 rounded-lg text-sm font-semibold border border-gray-200 shadow-sm hover:bg-gray-50 transition-colors">
                Create Auto-Groups</button>
            <button (click)="addFlight(1)"
                class="bg-white text-gray-700 px-4 py-2 rounded-lg text-sm font-semibold border border-gray-200 shadow-sm hover:bg-gray-50 transition-colors">
                Add New Group</button>

        </div>
        <div *ngIf="selectedMembers.length > 0" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

            <div *ngFor="let items of selectedMembers;
                        let i = index;
                        let j = index;
                        trackBy: trackByFn" class="bg-gray-50 border border-gray-200 rounded-lg p-4 flex flex-col">
                <div class="flex justify-between items-center mb-3">
                    <p class="font-bold text-lg text-gray-800">Group
                        No:{{ items.flightNo }}</p>
                    <!-- <span class="text-sm font-semibold text-emerald-600 bg-emerald-100 px-2 py-0.5 rounded">{{
                        items.flightNo
                        }}</span> -->
                    <span id="flight_{{ j }}_time" class="text-sm font-semibold text-emerald-600 bg-emerald-100 px-2 py-0.5 rounded">{{
                        convertToAMPMFormat(items.time) }}</span>
                </div>
                <div class="space-y-2">
                    <div *ngFor="
                                                    let item of items;
                                                    let j = index
                                                "
                        class="flex justify-between items-center text-sm py-2 rounded-md bg-white">
                        <span class="font-medium text-gray-700 text-md">{{ item.firstName }} {{ item.lastName }}</span>
                        <span class="flex gap-2 items-center">
                            <span class="text-gray-500">HC: {{ item.handicap }}</span>
                            <mat-icon aria-hidden="false" class="cursor-pointer"
                                (click)="removePlayer(i,j)">delete_forever</mat-icon>
                            <mat-icon aria-hidden="false" class="cursor-pointer"
                                (click)="movePlayer(i, j)">edit</mat-icon>
                        </span>
                    </div>

                    <div class="flex justify-end">
                        <button (click)="editFlight(items.id, i)" class="bg-emerald-600 text-white px-2 py-1 rounded-lg flex items-center text-sm
                                font-semibold
                                shadow-sm hover:bg-emerald-700 transition-colors">
                            Add Member</button>
                    </div>

                </div>
            </div>

        </div>
        <div *ngIf="selectedMembers.length > 0" class="flex justify-end mt-6">

            <button (click)="saveFlights()" class="bg-emerald-600 text-white px-4 py-2 rounded-lg flex items-center text-sm
                                font-semibold
                                shadow-sm hover:bg-emerald-700 transition-colors">
                Save Changes</button>

        </div>
    </div>

</div>
