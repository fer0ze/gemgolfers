<div class="flex-auto border-t -mt-px pt-4 sm:pt-6">
    <div class="w-full max-w-screen-xl mx-auto">
        <div class="mx-4">
            <div
                class="flex flex-col sm:flex-row items-center justify-between w-full mt-2 max-w-xs sm:max-w-none"
            >
                <mat-form-field
                    class="fuse-mat-no-subscript w-full sm:w-72 mb-4 sm:mt-0"
                    [floatLabel]="'always'"
                >
                    <mat-select
                        placeholder="Select Handicap System"
                        (selectionChange)="switchHandicapSystem($event.value)"
                        [(value)]="selected"
                    >
                        <mat-option value="congo">CONGU</mat-option>
                        <mat-option value="whs">WHS</mat-option>
                    </mat-select>
                </mat-form-field>
                <button
                    *ngIf="false"
                    mat-raised-button
                    color="primary"
                    (click)="calculateHandicap()"
                    [disabled]="playerList.length == 0"
                >
                    Update Handicap
                </button>
                <mat-form-field
                    class="fuse-mat-no-subscript w-full sm:w-72 mb-4 sm:mt-0"
                    [floatLabel]="'always'"
                >
                    <mat-icon
                        matPrefix
                        class="icon-size-5"
                        [svgIcon]="'heroicons_solid:search'"
                    ></mat-icon>
                    <input
                        (keyup)="applyFilter($event.target.value)"
                        placeholder="Filter"
                        matInput
                        #query
                    />
                </mat-form-field>
            </div>
            <div class="flex mt-2 justify-end ">
                <button mat-stroked-button (click)="downloadHandicapChange()">
                    <mat-icon
                        class="icon-size-5"
                        [svgIcon]="'heroicons_solid:dowload'"
                    ></mat-icon>
                    <span class="ml-2">Dowload Summary</span>
                </button>
            </div>
            <div
                class="mt-2 mb-3 flex flex-col flex-auto p-6 bg-card shadow rounded-2xl overflow-hidden"
                style="box-shadow: 0 2px 8px 0 rgba(0, 0, 0, 0.35)"
            >
                <table id="pdfTable" mat-table [dataSource]="dataSource" matSort>
                    <!-- Serial Column -->
                    <ng-container matColumnDef="id">
                        <th mat-header-cell *matHeaderCellDef>Sr.</th>
                        <td mat-cell *matCellDef="let row; let i = index">
                            {{ i + 1 }}
                        </td>
                    </ng-container>

                    <!-- Name Column -->
                    <ng-container matColumnDef="name">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header>
                            Player Name
                        </th>
                        <td mat-cell *matCellDef="let row">{{ row.name }}</td>
                    </ng-container>

                    <!-- Email Column -->
                    <ng-container matColumnDef="oldhandicap">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header>
                            Handicap
                        </th>
                        <td mat-cell *matCellDef="let row">
                            {{ row.oldhandicap | number : "1.1-1" }}
                        </td>
                    </ng-container>

                    <ng-container matColumnDef="handicap">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header>
                            New Handicap
                        </th>
                        <td mat-cell *matCellDef="let row">
                            {{
                                row.handicap == -1
                                    ? "-"
                                    : (row.handicap | number : "1.1-1")
                            }}
                        </td>
                    </ng-container>

                    <!-- Email Column -->
                    <ng-container matColumnDef="updated">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header>
                            Last Updated At
                        </th>
                        <td mat-cell *matCellDef="let row">
                            {{ row.updatedAt | date }}
                        </td>
                    </ng-container>
                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                    <tr
                        mat-row
                        *matRowDef="let row; columns: displayedColumns"
                    ></tr>
                </table>

                
            </div>
        </div>
    </div>
</div>
