<div mat-dialog-content>
    <div>
        <mat-form-field>
            <input
                matInput
                (keyup)="applyFilter($event.target.value)"
                placeholder="Filter"
            />
        </mat-form-field>
        <div class="flex justify-end ml-auto mb-1">
            <button mat-stroked-button (click)="downloadAsPDF()">
                <mat-icon
                    class="icon-size-5"
                    [svgIcon]="'heroicons_solid:dowload'"
                ></mat-icon>
                <span class="ml-2">Dowload Summary</span>
            </button>
        </div>
        <table id="playerTables" mat-table [dataSource]="dataSource" matSort>
            <!-- Membership Number Column -->
            <ng-container matColumnDef="membershipNumber">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>MNo.</th>
                <td mat-cell *matCellDef="let row">
                    {{ row.membershipNumber }}
                </td>
            </ng-container>

            <!-- First Name Column -->
            <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
                <td mat-cell *matCellDef="let row">
                    {{ row.firstName + " " + row.lastName }}
                </td>
            </ng-container>
            <!-- First Name Column -->
            <ng-container matColumnDef="cat">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Category</th>
                <td mat-cell *matCellDef="let row">
                    {{ row.playerCategory =='Seniors' ? 'Senior Amateurs' :row.playerCategory}}
                </td>
            </ng-container>

            <!-- Email Column -->
            <ng-container matColumnDef="handicap">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>
                    Handicap
                </th>
                <td mat-cell *matCellDef="let row">
                    <span *ngIf="row.handicap < 1">0</span>
                    <span *ngIf="row.handicap >= 1">{{
                        row.handicap | number : "1.1-1"
                    }}</span>
                </td>
            </ng-container>

            <!-- Email Column -->
            <ng-container matColumnDef="email">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Email</th>
                <td mat-cell *matCellDef="let row">{{ row.email }}</td>
            </ng-container>

           

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row  *matRowDef="let row; columns: displayedColumns"></tr>
        </table>
        <mat-paginator
            #MatPaginatorA="matPaginator"
            [pageSize]="10"
            [pageSizeOptions]="[10,20,30, 50, 100]"
        ></mat-paginator>
    </div>
</div>
<div mat-dialog-actions class="flex justify-center mt-4">
    <button mat-raised-button (click)="close()">Close</button>

</div>
