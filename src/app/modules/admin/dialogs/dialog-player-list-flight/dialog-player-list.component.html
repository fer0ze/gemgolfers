<div mat-dialog-content *ngIf="show">
    <div>
        <div class="flex flex-row gap-x-2 items-center">
            <mat-form-field class="mt-2">
                <input matInput (keyup)="applyFilter($event.target.value)" placeholder="Filter" />
            </mat-form-field>
            <!-- <button class="w-40 mx-1 mt-1" mat-raised-button [color]="'accent'" (click)="addGuest()">
                <mat-icon svgIcon="heroicons_solid:user-plus"></mat-icon>
                Add Guest
            </button> -->
        </div>

        <table id="playerTable" mat-table [dataSource]="dataSource" matSort>
            <!-- Membership Number Column -->
            <ng-container matColumnDef="membershipNumber">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>MNo.</th>
                <td mat-cell *matCellDef="let row">
                    {{ row.membershipNumber }}
                </td>
            </ng-container>

            <!-- First Name Column -->
            <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
                <td mat-cell *matCellDef="let row">
                    {{ (row.firstName + " " + row.lastName)| uppercase }}
                </td>
            </ng-container>
            <!-- First Name Column -->
            <ng-container matColumnDef="cat">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>
                    Category
                </th>
                <td mat-cell *matCellDef="let row">
                    {{
                    row.playerCategory == "Seniors"
                    ? "Senior Amateurs"
                    : row.playerCategory
                    }}
                </td>
            </ng-container>

            <!-- Email Column -->
            <ng-container matColumnDef="handicap">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>
                    Handicap
                </th>
                <td mat-cell *matCellDef="let row">
                    <span *ngIf="row.handicap < 1">0</span>
                    <span *ngIf="row.handicap >= 1">{{
                        row.handicap | number : "1.1-1"
                        }}</span>
                </td>
            </ng-container>

            <!-- Email Column -->
            <ng-container matColumnDef="email">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Email</th>
                <td mat-cell *matCellDef="let row">{{ row.email }}</td>
            </ng-container>

            <ng-container matColumnDef="select">
                <th mat-header-cell *matHeaderCellDef>
                    <mat-checkbox (change)="$event ? masterToggle() : null"
                        [checked]="selection.hasValue() && isAllSelected()" [indeterminate]="
                            selection.hasValue() && !isAllSelected()
                        " [aria-label]="checkboxLabel()">
                    </mat-checkbox>
                </th>
                <td mat-cell *matCellDef="let row">
                    <mat-checkbox (click)="$event.stopPropagation()" (change)="$event ? selection.toggle(row) : null"
                        [checked]="selection.isSelected(row)" [aria-label]="checkboxLabel(row)">
                    </mat-checkbox>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>
        <mat-paginator [pageSize]="20" [pageSizeOptions]="[20, 30, 50, 100]"></mat-paginator>
    </div>
</div>
<div mat-dialog-actions class="flex justify-center mt-4" *ngIf="show">
    <button mat-raised-button (click)="close()">Close</button>
    <button mat-raised-button color="primary" (click)="saveTournamentMembers()" cdkFocusInitial>
        Save Member
    </button>
</div>
