<div class="example-container">
  <div>
    <mat-card>
      <div class="box" *ngIf="this.dates">
        <div *ngFor="let t of this.category; let i = index">
          <button
            mat-raised-button
            mat-button
            style="
              color: snow;
              background-color: #135364;
              margin-top: 4px;
              margin-right: 2px;
            "
          >
            Playing Dates:{{ t.dates }}
          </button>
        </div>
      </div>
      <div *ngIf="!this.dates" class="box" fxLayout="row">
        <button
          mat-raised-button
          mat-button
          style="
            color: snow;
            background-color: #135364;
            margin-top: 4px;
            margin-right: 2px;
          "
        >
          Playing Dates: Not Yet Schedule!
        </button>
      </div>
    </mat-card>
  </div>

  <div>
    <mat-card>
      <table mat-table [dataSource]="dataSource" matSort>
        <!-- Serial Column -->
        <!-- <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef> Sr. </th>
        <td mat-cell *matCellDef="let row; let i = index"> {{i + 1}} </td>
    </ng-container> -->

        <!-- firstname Column -->
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Sr.</th>
          <td mat-cell *matCellDef="let row; let i = index">{{ i + 1 }}</td>
        </ng-container>
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
          <td mat-cell *matCellDef="let row">{{ row["player"].firstName }}</td>
        </ng-container>

        <!-- lastname Column -->
        <!-- <ng-container matColumnDef="lastName">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> lastName </th>
      <td mat-cell *matCellDef="let row">{row.lastName}} </td>
    </ng-container> -->

        <!-- hanidcap Column -->
        <ng-container matColumnDef="handicap">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>handicap</th>
          <td mat-cell *matCellDef="let row">{{ row["player"].handicap }}</td>
        </ng-container>

        <!-- phone Column -->
        <ng-container matColumnDef="phone">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Phone</th>
          <td mat-cell *matCellDef="let row">{{ row["player"].phone }}</td>
        </ng-container>

        <!-- email Column -->
        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Email</th>
          <td mat-cell *matCellDef="let row">{{ row["player"].email }}</td>
        </ng-container>

        <ng-container matColumnDef="membershipNumber">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>
            MembershipNo
          </th>
          <td mat-cell *matCellDef="let row">
            {{ row["player"].membershipNumber }}
          </td>
        </ng-container>
        <ng-container matColumnDef="category">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Category</th>
          <td mat-cell *matCellDef="let row">
            {{ row["player"].playerCategory }}
          </td>
        </ng-container>

        <!-- email Column -->
        <ng-container matColumnDef="club">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Club</th>
          <td mat-cell *matCellDef="let row">
            <div *ngFor="let item of row.membership">
              {{ item["palyer"].club.name }}
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr
          mat-row
          *matRowDef="let row; columns: displayedColumns"
          [ngClass]="{ selectedPlayer: selectedRowIndex == row.id }"
          (click)="selectPlayer(row)"
        ></tr>
      </table>
    </mat-card>

    <mat-paginator
      [pageSize]="50"
      [pageSizeOptions]="[50, 100, 150]"
    ></mat-paginator>
  </div>
</div>
