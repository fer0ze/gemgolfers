<div class="example-container">
<table mat-table [dataSource]="dataSource" matSort>

  <!-- Serial Column -->
  <!-- <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef> Sr. </th>
      <td mat-cell *matCellDef="let row; let i = index"> {{i + 1}} </td>
  </ng-container> -->

  <!-- firstname Column -->
  <ng-container matColumnDef="firstName">
    <th mat-header-cell *matHeaderCellDef mat-sort-header> firstName </th>
    <td mat-cell *matCellDef="let row"> {{row.firstName | uppercase}} </td>
</ng-container>

  <!-- lastname Column -->
  <ng-container matColumnDef="lastName">
    <th mat-header-cell *matHeaderCellDef mat-sort-header> lastName </th>
    <td mat-cell *matCellDef="let row"> {{row.lastName| uppercase }} </td>
  </ng-container>

  <!-- hanidcap Column -->
  <ng-container matColumnDef="handicap">
    <th mat-header-cell *matHeaderCellDef mat-sort-header> handicap </th>
    <td mat-cell *matCellDef="let row"> {{row.handicap}} </td>
  </ng-container>

  <!-- phone Column -->
  <ng-container matColumnDef="phone">
    <th mat-header-cell *matHeaderCellDef mat-sort-header> Phone </th>
    <td mat-cell *matCellDef="let row"> {{row.phone}} </td>
  </ng-container>

  <!-- email Column -->
  <ng-container matColumnDef="email">
    <th mat-header-cell *matHeaderCellDef mat-sort-header> Email </th>
    <td mat-cell *matCellDef="let row"> {{row.email}} </td>
  </ng-container>


  <ng-container matColumnDef="membershipNo">
    <th mat-header-cell *matHeaderCellDef mat-sort-header> MembershipNo </th>
    <td mat-cell *matCellDef="let row"> {{row.membershipNo}} </td>
  </ng-container>

  <!-- email Column -->
  <ng-container matColumnDef="club">
    <th mat-header-cell *matHeaderCellDef mat-sort-header> Club </th>
    <td mat-cell *matCellDef="let row"><div *ngFor="let item of row.membership">{{ item.club.name }}</div></td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;" [ngClass]="{'selectedPlayer': selectedRowIndex == row.id}" (click)="selectPlayer(row)"></tr>
</table>
<mat-paginator [pageSize]="50" [pageSizeOptions]="[50, 100, 150]"></mat-paginator>
</div>
