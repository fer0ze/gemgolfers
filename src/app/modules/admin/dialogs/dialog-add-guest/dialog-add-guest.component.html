<div>
    <section fxLayout="row wrap" class="w-160" fxLayoutAlign="center center">

        <form [formGroup]="playerForm" autocomplete="off" novalidate (ngSubmit)="createPlayer()"
            fxLayout="column wrap" fxLayoutAlign="center center">
            <mat-card-content>
                <mat-form-field>
                    <mat-label>First Name</mat-label>
                    <input matInput type="text" placeholder="First Name" formControlName="firstName" id="firstName" />

                    <mat-error *ngIf="hasError('firstName', 'required')">Name is required</mat-error>
                    <mat-error *ngIf="hasError('firstName', 'maxlength')">You have more than 60 characters</mat-error>
                    <mat-icon matSuffix>face</mat-icon>
                </mat-form-field>

                <mat-form-field>
                    <mat-label>Last Name</mat-label>
                    <input matInput type="text" placeholder="Last Name" formControlName="lastName" />

                    <mat-error *ngIf="hasError('lastName', 'required')">Address is required</mat-error>
                    <mat-error *ngIf="hasError('lastName', 'maxlength')">You have more than 100 characters</mat-error>
                    <mat-icon matSuffix>face</mat-icon>
                </mat-form-field>



                

                <mat-form-field>
                    <mat-label>Email</mat-label>
                    <input matInput type="text" placeholder="Player's email" formControlName="email" />

                    <mat-error *ngIf="hasError('email', 'required')">Email is required</mat-error>
                    <mat-error *ngIf="hasError('email', 'maxlength')">You have more than 60 characters</mat-error>
                    <mat-error *ngIf="hasError('email', 'email')">Enter a valid email address</mat-error>
                    <mat-icon matSuffix>email</mat-icon>
                </mat-form-field>

              

                <mat-form-field>
                    <mat-label>Handicap</mat-label>
                    <input matInput type="text" placeholder="Player's Handicap" type="number"
                        formControlName="handicap" />
                    <mat-error *ngIf="hasError('handicap', 'required')">Phone is required</mat-error>
                    <mat-icon matSuffix>golf_course</mat-icon>
                </mat-form-field>

                
            </mat-card-content>

            <mat-card-actions align="center">
                <button class="mx-2" mat-raised-button color="primary" [disabled]="!playerForm.valid" cdkFocusInitial>
                    Save
                </button>
                <button type="button" mat-raised-button color="warn" (click)="onNoClick()">
                    Cancel
                </button>
            </mat-card-actions>
        </form>

    </section>
</div>
