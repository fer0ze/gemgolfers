<div mat-dialog-content>
  <div>
    <mat-form-field>
      <input matInput (keyup)="applyFilter($event.target.value)" placeholder="Filter">
    </mat-form-field>
    <div
    class="pb-4"
    style="text-align: right; padding-top: 10px; color: red; cursor: pointer"
  >
    <!-- <mat-icon
      aria-hidden="false"
      aria-label="Dragable"
      class="remove"
      (click)="downloadAsPDF()"
      >picture_as_pdf</mat-icon
    > -->
    <button
                                    mat-raised-button
                                    color="warn"
                                    style="border-radius: 7px !important;"
                                    (click)="saveTournamentMembers()"
                                >
                                    Save Selected Members
                                </button>
  </div>
    <table id="playerTable" mat-table [dataSource]="dataSource" matSort>

        <!-- Serial Column -->
        <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef> Sr. </th>
            <td mat-cell *matCellDef="let row; let i = index"> {{i + 1}} </td>
        </ng-container>

        <!-- Membership Number Column -->
        <ng-container matColumnDef="membershipNumber">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> MNo. </th>
          <td mat-cell *matCellDef="let row"> {{row.membershipNumber}} </td>
        </ng-container>

        <!-- First Name Column -->
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Name </th>
          <td mat-cell *matCellDef="let row"> {{row.firstName + " " + row.lastName}} </td>
      </ng-container>

        <!-- Email Column -->
        <ng-container matColumnDef="handicap">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Handicap </th>
          <td mat-cell *matCellDef="let row"> <span *ngIf="row.handicap < 1">0</span> <span *ngIf="row.handicap >= 1">{{row.handicap | number : '1.1-1'}}</span> </td>
        </ng-container>

        <!-- Email Column -->
        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Email </th>
          <td mat-cell *matCellDef="let row"> {{row.email}} </td>
        </ng-container>

        <ng-container matColumnDef="select">
          <th
              mat-header-cell
              *matHeaderCellDef
          >
              <mat-checkbox
                  (change)="
                      $event
                          ? masterToggle()
                          : null
                  "
                  [checked]="
                      selection.hasValue() &&
                      isAllSelected()
                  "
                  [indeterminate]="
                      selection.hasValue() &&
                      !isAllSelected()
                  "
                  [aria-label]="
                      checkboxLabel()
                  "
              >
              </mat-checkbox>
          </th>
          <td mat-cell *matCellDef="let row">
              <mat-checkbox
                  (click)="
                      $event.stopPropagation()
                  "
                  (change)="
                      $event
                          ? selection.toggle(
                                row
                            )
                          : null;
                      
                  "
                  [checked]="
                      selection.isSelected(
                          row
                      )
                  "
                  [aria-label]="
                      checkboxLabel(row)
                  "
              >
              </mat-checkbox>
          </td>
      </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
    <mat-paginator [pageSize]="20" [pageSizeOptions]="[10, 20, 50, 100]"></mat-paginator>
</div>
