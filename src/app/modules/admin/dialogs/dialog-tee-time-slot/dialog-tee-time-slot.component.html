<div mat-dialog-content>
    <h3 class="m-3">Tee Time Booking Slots</h3>
    <mat-accordion>
        <mat-expansion-panel *ngFor="let item of this.slotList" (opened)="onPanelOpened(item)">
            <mat-expansion-panel-header class="py-8" [ngClass]="{
                    full: item.joinedMembers > 3,
                    partial: item.joinedMembers > 0 && item.joinedMembers < 4
                }">
                <mat-panel-title>
                    <table>
                        <tr>
                            <td>{{ item.slotTime.substring(0, 5) }}</td>
                            <td>{{ item.joinedMembers }}/4</td>
                            <td>Tee Box {{ item.startingHole }}</td>
                        </tr>
                    </table>
                </mat-panel-title>
                <mat-panel-description>
                    <mat-icon class="mat-18" [ngClass]="{
                            active: item.joinedMembers > 3,
                            disabled: item.joinedMembers < 4
                        }">check_circle</mat-icon>
                </mat-panel-description>
            </mat-expansion-panel-header>

            <ng-template matExpansionPanelContent>
                <div *ngIf="isPanelOpened(item)">
                    <!-- Your mat-table goes here -->
                    <table class="w-full bg-transparent" mat-table [dataSource]="dataSource" matSort>
                        <ng-container matColumnDef="firstName">
                            <th mat-header-cell mat-sort-header *matHeaderCellDef>
                                First Name
                            </th>
                            <td mat-cell *matCellDef="let account">
                                <span class="pr-6 whitespace-nowrap">
                                    {{account.firstName}}
                                </span>
                            </td>
                        </ng-container>
                        <ng-container matColumnDef="lastName">
                            <th mat-header-cell mat-sort-header *matHeaderCellDef>
                                Last Name
                            </th>
                            <td mat-cell *matCellDef="let account">
                                <span class="pr-6 whitespace-nowrap">
                                    {{account.lastName}}
                                </span>
                            </td>
                        </ng-container>
                        <ng-container matColumnDef="email">
                            <th mat-header-cell mat-sort-header *matHeaderCellDef>
                                Email
                            </th>
                            <td mat-cell *matCellDef="let account">
                                <span class="pr-6 whitespace-nowrap">
                                    {{account.email}}
                                </span>
                            </td>
                        </ng-container>
                        <ng-container matColumnDef="handicap">
                            <th mat-header-cell mat-sort-header *matHeaderCellDef>
                                Handicap
                            </th>
                            <td mat-cell *matCellDef="let account">
                                <span class="pr-6 whitespace-nowrap">
                                    {{account.handicap}}
                                </span>
                            </td>
                        </ng-container>
                        <ng-container matColumnDef="action">
                            <th mat-header-cell mat-sort-header *matHeaderCellDef>
                                Action
                            </th>
                            <td mat-cell *matCellDef="let account">
                                <div class="flex">
                                    <span class="font-medium ml-1 whitespace-nowrap">
                                        <button [matTooltip]="'Delete User'">
                                            <mat-icon class="icon-size-7" [svgIcon]="'heroicons_solid:delete'"
                                                color="warn"></mat-icon>
                                        </button>
                                    </span>
                                </div>
                            </td>
                        </ng-container>
                        <ng-container>
                            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                            <tr class="order-row h-16" mat-row *matRowDef="let row; columns: displayedColumns;">
                            </tr>
                        </ng-container>
                    </table>
                </div>
            </ng-template>
        </mat-expansion-panel>
    </mat-accordion>
</div>
