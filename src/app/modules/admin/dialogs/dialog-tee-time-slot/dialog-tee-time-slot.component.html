<div mat-dialog-content>
    <h3 class="m-3">Tee Time Booking Slots</h3>
    <mat-accordion>
        <mat-expansion-panel  *ngFor="let item of this.slotList">
            <mat-expansion-panel-header
            class="py-8"
                [ngClass]="{
                    full: item.joinedMembers > 3,
                    partial: item.joinedMembers > 0 && item.joinedMembers < 4
                }"
            >
                <mat-panel-title>
                    <table>
                        <tr [ngClass]="{ white: item.joinedMembers > 0 }">
                            <td>{{ item.slotTime.substring(0, 5) }}</td>
                            <td>{{ item.joinedMembers }}/4</td>
                            <td>Tee Box {{ item.startingHole }}</td>
                        </tr>
                    </table>
                </mat-panel-title>
                <mat-panel-description>
                    <mat-icon
                        class="mat-18"
                        [ngClass]="{
                            active: item.joinedMembers > 3,
                            disabled: item.joinedMembers < 4
                        }"
                        >check_circle</mat-icon
                    >
                </mat-panel-description>
            </mat-expansion-panel-header>

            <ng-template matExpansionPanelContent>
                <div
                    class="membersList"
                    *ngFor="
                        let item of item.flight
                            ? item.flight.MembersQL
                                ? item.flight.MembersQL
                                : ['']
                            : ['']
                    "
                >
                    {{
                        item.PlayerQL
                            ? item.PlayerQL.firstName +
                              " " +
                              item.PlayerQL.lastName
                            : ""
                    }}
                </div>
            </ng-template>
        </mat-expansion-panel>
    </mat-accordion>
</div>
