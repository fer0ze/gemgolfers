<div class="flex-auto">
    <div
        class="flex flex-col sm:flex-row md:flex-col flex-auto bg-card justify-between py-8 px-6 md:px-8 border-b"
    >
        <!-- Title -->
        <div>
            <div class="text-4xl font-extrabold tracking-tight leading-none">
                Daily Rounds
            </div>
        </div>
        <div class="flex items-center mt-4 sm:mt-0 md:mt-4">
            <div class="w-90">
                <form [formGroup]="scheduleForm">
                    <div class="flex">
                        <mat-form-field
                            appearance="fill"
                            class="fuse-mat-no-subscript flex-auto"
                            formControlName="startDate"
                        >
                            <mat-select
                                placeholder="Today"
                                (selectionChange)="Dailysetup($event)"
                                class="mr-1.5"
                            >
                                <mat-option value="Today">Today</mat-option>
                                <mat-option value="Yesterday"
                                    >Yesterday</mat-option
                                >
                                <mat-option value="Last_Week"
                                    >Last Week</mat-option
                                >
                                <mat-option value="Last_Month"
                                    >Last Month</mat-option
                                >
                                <mat-option value="Custom">Custom</mat-option>
                            </mat-select>
                        </mat-form-field>
                    </div>
                </form>
            </div>
            <div class=" mx-7 w-90">
                <form [formGroup]="scheduleForm">
                    <mat-form-field class="fuse-mat-no-subscript w-full">
                        <mat-icon
                            matPrefix
                            class="hidden sm:flex icon-size-5"
                            [svgIcon]="'heroicons_solid:cake'"
                        ></mat-icon>
                        <input
                            matInput
                            [matDatepicker]="startDate"
                            formControlName="startDate"
                            [placeholder]="'Enter Start Date'"
                        />
                        <mat-datepicker-toggle matSuffix [for]="startDate">
                        </mat-datepicker-toggle>
                        <mat-datepicker #startDate></mat-datepicker>
                    </mat-form-field>
                </form>
            </div>

            <div class=" mx-5 w-90">
                <form [formGroup]="scheduleForm">
                    <mat-form-field class="fuse-mat-no-subscript w-full">
                        <mat-icon
                            matPrefix
                            class="hidden sm:flex icon-size-5"
                            [svgIcon]="'heroicons_solid:cake'"
                        ></mat-icon>
                        <input
                            matInput
                            [matDatepicker]="endDate"
                            formControlName="endDate"
                            [placeholder]="'Enter End Date'"
                        />
                        <mat-datepicker-toggle matSuffix [for]="endDate">
                        </mat-datepicker-toggle>
                        <mat-datepicker #endDate></mat-datepicker>
                    </mat-form-field>
                </form>
            </div>
            <div >
                <button
                    mat-raised-button
                    color="primary"
                    (click)="onDatePick()"
                >
                    Search Round
                </button>
                <!-- <button mat-raised-button color="primary" (click)="showDuplicates()" >Duplicates</button> -->
            </div>
            <div class="">
                <button class="ml-4" mat-raised-button (click)="newRound()" [color]="'accent'">
                    <mat-icon [svgIcon]="'heroicons_outline:plus'"></mat-icon>
                    <span  class="ml-2 mr-1">Add Round</span>
                </button>
                <!-- <button mat-raised-button color="primary" (click)="showDuplicates()" >Duplicates</button> -->
            </div>
        </div>
    </div>

    <!-- <button mat-raised-button color="accent" (click)="getDailyRounds(fromDate,toDate)">Back</button> &nbsp;  -->
    <div class="relative" *ngIf="showtable">

                    </div>

        <table
            mat-table
            [dataSource]="dataSource"
            matSort
            class="w-full bg-transparent"
        >
            <ng-container matColumnDef="id">
                <th
                    class="bg-gray-50 dark:bg-black dark:bg-opacity-5"
                    mat-header-cell
                    *matHeaderCellDef
                >
                    Sr.
                </th>
                <td mat-cell *matCellDef="let row; let i = index">
                    {{ i + 1 }}
                </td>
            </ng-container>

            <ng-container matColumnDef="dates">
                <th
                    class="bg-gray-50 dark:bg-black dark:bg-opacity-5"
                    mat-header-cell
                    *matHeaderCellDef
                    mat-sort-header
                >
                    Dates
                </th>
                <td mat-cell *matCellDef="let row">{{ row.date }}</td>
            </ng-container>

            <ng-container matColumnDef="noOfFlights">
                <th
                    class="bg-gray-50 dark:bg-black dark:bg-opacity-5"
                    mat-header-cell
                    *matHeaderCellDef
                    mat-sort-header
                >
                    Total Flights
                </th>
                <td mat-cell *matCellDef="let row">
                    {{ row.totalFlights }}
                </td>
            </ng-container>

            <!-- Email Column -->
            <ng-container matColumnDef="membersCount">
                <th
                    class="bg-gray-50 dark:bg-black dark:bg-opacity-5"
                    mat-header-cell
                    *matHeaderCellDef
                    mat-sort-header
                >
                    Total Members Played
                </th>
                <td mat-cell *matCellDef="let row">
                    {{ row.membersCount }}
                </td>
            </ng-container>

            <ng-container matColumnDef="details">
                <th
                    class="bg-gray-50 dark:bg-black dark:bg-opacity-5"
                    mat-header-cell
                    *matHeaderCellDef
                    mat-sort-header
                >
                    Details
                </th>
                <td mat-cell *matCellDef="let row">
                    <button mat-icon-button color="primary">
                        <mat-icon
                            (click)="redirectToView(row.date)"
                            class="mat-18"
                            color="accent"
                            >reorder</mat-icon
                        >
                    </button>
                </td>
            </ng-container>

            <ng-container matColumnDef="score">
                <th
                    class="bg-gray-50 dark:bg-black dark:bg-opacity-5"
                    mat-header-cell
                    *matHeaderCellDef
                    mat-sort-header
                >
                    Player Wise Score
                </th>
                <td mat-cell *matCellDef="let row">
                    <button mat-icon-button color="primary">
                        <mat-icon
                            (click)="redirectToPlayersScore(row.date)"
                            class="mat-18"
                            >golf_course</mat-icon
                        >
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>

        <mat-paginator
            [pageSize]="20"
            [pageSizeOptions]="[10, 20, 50, 100]"
        ></mat-paginator>
    </div>
</div>
