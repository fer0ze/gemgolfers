<div class="flex flex-col flex-auto min-w-0">

    <!-- Header -->
    <div class="relative pt-8 pb-28 px-4 sm:pt-20 sm:pb-48 sm:px-16 overflow-hidden bg-gray-800 dark:bg-gray-900 dark">
        <!-- Background - @formatter:off -->
        <!-- Rings -->
        <svg class="absolute inset-0 pointer-events-none" viewBox="0 0 960 540" width="100%" height="100%"
            preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
            <g class="text-gray-700 opacity-25" fill="none" stroke="currentColor" stroke-width="100">
                <circle r="234" cx="196" cy="23"></circle>
                <circle r="234" cx="790" cy="491"></circle>
            </g>
        </svg>
        <!-- @formatter:on -->
    </div>

    <div class="flex flex-col items-center pb-6 px-6 sm:pb-10 sm:px-10">
        <!-- Cards -->
        <div
            class="grid grid-cols-1 md:grid-cols-3 gap-y-8 md:gap-y-0 md:gap-x-6 w-full max-w-sm md:max-w-4xl -mt-16 sm:-mt-24">
            <!-- FAQs card -->
            <div
                class="relative flex flex-col rounded-2xl shadow hover:shadow-lg overflow-hidden bg-card transition-shadow ease-in-out duration-150">
                <div class="flex flex-col flex-auto items-center p-8 text-center">
                    <div class="text-2xl font-semibold">Itinerary</div>
                    <div class="md:max-w-40 mt-1 text-secondary">Articles and resources to guide you.</div>
                </div>
                <div
                    class="flex items-center justify-center py-4 px-8 text-primary-500 cursor-pointer dark:text-primary-400 bg-gray-50 dark:bg-transparent dark:border-t">
                    <div class="flex items-center" (click)="viewGuides()">
                        <span class="absolute inset-0"></span>
                        <span class="font-medium">Check Itinerary</span>
                        <mat-icon class="ml-2 icon-size-5 text-current"
                            [svgIcon]="'heroicons_solid:arrow-narrow-right'"></mat-icon>
                    </div>
                </div>
            </div>
            <div
                class="relative flex flex-col rounded-2xl shadow hover:shadow-lg cursor-pointer overflow-hidden bg-card transition-shadow ease-in-out duration-150">
                <div class="flex flex-col flex-auto items-center p-8 text-center">
                    <div class="text-2xl font-semibold">Members</div>
                    <div class="md:max-w-40 mt-1 text-secondary">Tour Members that are added</div>
                </div>
                <div
                    class="flex items-center justify-center py-4 px-8 text-primary-500 dark:text-primary-400 bg-gray-50 dark:bg-transparent dark:border-t">
                    <div class="flex items-center" (click)="viewMembers()">
                        <span class="absolute inset-0"></span>
                        <span class="font-medium">Go to members</span>
                        <mat-icon class="ml-2 icon-size-5 text-current"
                            [svgIcon]="'heroicons_solid:arrow-narrow-right'"></mat-icon>
                    </div>
                </div>
            </div>
            <!-- Guides card -->

            <!-- Support card -->
            <div
                class="relative flex flex-col rounded-2xl shadow hover:shadow-lg cursor-pointer overflow-hidden bg-card transition-shadow ease-in-out duration-150">
                <div class="flex flex-col flex-auto items-center p-8 text-center">
                    <div class="text-2xl font-semibold">Tournaments</div>
                    <div class="md:max-w-40 mt-1 text-secondary">Tour Tournaments that are being played</div>
                </div>
                <div
                    class="flex items-center justify-center py-4 px-8 text-primary-500 dark:text-primary-400 bg-gray-50 dark:bg-transparent dark:border-t">
                    <div class="flex items-center" (click)="viewTournaments()">
                        <span class="absolute inset-0"></span>
                        <span class="font-medium">Go to tournaments</span>
                        <mat-icon class="ml-2 icon-size-5 text-current"
                            [svgIcon]="'heroicons_solid:arrow-narrow-right'"></mat-icon>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
