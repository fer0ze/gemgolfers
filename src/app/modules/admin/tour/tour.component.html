<div class="absolute inset-0 flex flex-col min-w-0 overflow-y-auto" cdkScrollable>

    <!-- Main -->
    <div class="relative flex-0 py-8 px-4 sm:p-14 overflow-hidden border-b bg-card">



        <div class="text-6xl font-extrabold tracking-tight leading-none">
            Your Tours
        </div>

    </div>

    <!-- tours -->
    <div class="flex flex-auto p-6 sm:p-10">
        <div class="flex flex-col flex-auto w-full max-w-xs sm:max-w-5xl mx-auto">
            <div class="flex flex-col sm:flex-row items-center justify-between w-full max-w-xs sm:max-w-none">
                <mat-form-field *ngIf="this.loggedInuser.userRole== 1 || this.loggedInuser.userRole==2"
                    class="fuse-mat-no-subscript w-full sm:w-36">
                    <mat-select [value]="0" (selectionChange)="filterByCategory($event)">

                        <ng-container *ngFor="
                                    let category of categories;
                                    trackBy: trackByFn
                                ">
                            <mat-option [value]="category.id">{{
                                category.title
                                }}</mat-option>
                        </ng-container>
                    </mat-select>
                </mat-form-field>
                <mat-form-field class="fuse-mat-no-subscript w-full sm:w-72 mt-4 sm:mt-0 sm:ml-4"
                    [floatLabel]="'always'">
                    <mat-icon matPrefix class="icon-size-5" [svgIcon]="'heroicons_solid:search'"></mat-icon>
                    <input (input)="filterByQuery(query.value)" placeholder="Search by title" matInput #query />
                </mat-form-field>
                <button class="bg-accent" mat-flat-button (click)="addnewTour()" [color]="'accent'">
                    <mat-icon class="icon-size-5" [svgIcon]="'heroicons_solid:plus-circle'"></mat-icon>
                    <span class="ml-2">Add New Tour</span>
                </button>
                <!-- <mat-slide-toggle
                        class="mt-8 sm:mt-0 sm:ml-auto"
                        [color]="'primary'"
                        (change)="toggleCompleted($event)"
                    >
                        Hide completed
                    </mat-slide-toggle> -->
            </div>
            <ng-container *ngIf="this.tours.length; else noCourses">
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 mt-8 sm:mt-10">
                    <ng-container *ngFor="let tour of tours;">
                        <div class="flex flex-col h-96 shadow rounded-2xl overflow-hidden bg-card">
                            <div class="flex flex-col p-6">
                                <div *ngIf="!tour.logo"
                                    class="flex items-center justify-center p-4 rounded-full bg-primary-50 text-primary-700 dark:bg-primary dark:text-on-primary mr-auto">
                                    <mat-icon class="text-current" [svgIcon]="'heroicons_outline:template'"></mat-icon>
                                </div>
                                <div class="flex flex-0 items-center justify-center w-14 h-14 rounded-full overflow-hidden"
                                    *ngIf="tour.logo">
                                    <ng-container>
                                        <img class="object-cover w-full h-full" [src]="tour.logo" alt="User avatar" />
                                    </ng-container>
                                </div>
                                <div class="mt-1 text-lg font-medium">
                                    {{tour.title}}
                                </div>
                                <div class="w-12 h-1 mt-6 border-t-2"></div>
                                <div class="flex items-center mt-2 text-md font-md -ml-1">
                                    <mat-icon class="icon-size-5 text-hint"
                                        [svgIcon]="'heroicons_solid:clipboard'"></mat-icon>
                                    <div class="text-secondary ml-1">Tournaments:</div>
                                    <div class="ml-1">{{tour.tournaments}}</div>
                                </div>
                                <div class="flex items-center mt-2 text-md font-md -ml-1">
                                    <mat-icon class="icon-size-5 text-hint"
                                        [svgIcon]="'heroicons_solid:user-group'"></mat-icon>
                                    <div class="text-secondary ml-1">Members:</div>
                                    <div class="ml-1">{{tour.members}}</div>
                                </div>
                                <div class="flex items-center mt-2 text-md font-md -ml-1">
                                    <mat-icon class="icon-size-5 text-hint"
                                        [svgIcon]="'heroicons_solid:clock'"></mat-icon>
                                    <div class="text-secondary ml-1">Start Date:</div>
                                    <div class="ml-1">{{tour.startDate | date:'dd/MM/yyyy'}}</div>
                                </div>
                                <div class="flex items-center mt-2 text-md font-md -ml-1">
                                    <mat-icon class="icon-size-5 text-hint"
                                        [svgIcon]="'heroicons_solid:clock'"></mat-icon>
                                    <div class="text-secondary ml-1">End Date:</div>
                                    <div class="ml-1">{{tour.endDate | date:'dd/MM/yyyy'}}</div>
                                </div>
                            </div>
                            <div class="flex flex-col w-full mt-auto">
                                <!-- Course progress -->
                                <div class="relative h-0.5">
                                    <div class="z-10 absolute inset-x-0 h-6 -mt-3" [matTooltipPosition]="'above'"
                                        [matTooltipClass]="'-mb-0.5'"></div>
                                    <mat-progress-bar class="h-0.5" [value]="1002"></mat-progress-bar>
                                </div>

                                <!-- Course launch button -->
                                <div class="px-6 py-4 text-right bg-gray-50 dark:bg-transparent">
                                    <a mat-stroked-button [routerLinkActive]="'active'"
                                    [routerLink]="[tour.id]">
                                        <span class="inline-flex items-center">
                                            <!-- Not started -->

                                            <!-- Started -->
                                            <ng-container>
                                                <span>View Details</span>
                                            </ng-container>

                                            <mat-icon class="ml-1.5 icon-size-5" [svgIcon]="
                                                    'heroicons_solid:arrow-sm-right'
                                                "></mat-icon>
                                        </span>
                                    </a>
                                </div>
                            </div>
                        </div>



                    </ng-container>
                </div>
            </ng-container>
        </div>
        <!-- New board -->
        <ng-template #noCourses>
            <div class="flex flex-auto flex-col items-center justify-center bg-gray-100 dark:bg-transparent">
                <mat-icon class="icon-size-24" [svgIcon]="'heroicons_outline:document-search'"></mat-icon>
                <div class="mt-6 text-2xl font-semibold tracking-tight text-secondary">
                    No Tour found!
                </div>
            </div>
        </ng-template>
    </div>



</div>
